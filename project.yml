name: Lumina
options:
  bundleIdPrefix: com.lumina
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
targets:
  Lumina:
    type: application
    platform: iOS
    sources:
      - Lumina
    info:
      path: Lumina/Info.plist
      properties:
        CFBundleDisplayName: Lumina
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumina.chat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: LuminaActivityWidget
  LuminaActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - LuminaActivityWidget
      - Lumina/LiveActivity
    info:
      path: LuminaActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Lumina 实时活动
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumina.chat.LuminaActivity
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
